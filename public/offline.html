<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ValueFlow — You're Offline</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #0b1120;
        color: #e5e7eb;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 24px;
      }
      .icon {
        width: 80px;
        height: 80px;
        border-radius: 18px;
        margin-bottom: 24px;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        color: #f9fafb;
        margin-bottom: 8px;
      }
      p {
        font-size: 0.95rem;
        color: #9ca3af;
        max-width: 320px;
        line-height: 1.6;
        margin-bottom: 32px;
      }
      button {
        background: #3cb371;
        color: #fff;
        border: none;
        padding: 12px 28px;
        border-radius: 8px;
        font-size: 0.95rem;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.2s;
      }
      button:hover {
        background: #2e9d5e;
      }
    </style>
  </head>
  <body>
    <img src="/icons/icon-192.png" alt="ValueFlow" class="icon" />
    <h1>You're offline</h1>
    <p>
      ValueFlow needs an internet connection. Check your connection and try
      again.
    </p>
    <button onclick="window.location.reload()">Try Again</button>
  </body>
</html>
